# Site wide configuration

title: Wenri JUSHI
locale: en_US
description: IS NULL and IS NOT NULL
logo: /images/site-logo.png
search: true
url: https://wenri.me

# Jekyll configuration

permalink:   /:categories/:title/
markdown:    kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Front Matter Defaults
defaults:
  # Posts defaults
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      share: true

# Site Author
author:
  name: Bingchen Gong
  picture: /images/bio-photo.jpg
  email: gongbingchen@gmail.com

# Footer social icons (rendered by _includes/footer.html; FA 6 icon classes)
footer_links:
  - title: GitHub
    url: https://github.com/Wenri
    icon: fab fa-github
  - title: GitLab
    url: https://gitlab.com/gt404
    icon: fab fa-gitlab
  - title: Google Scholar
    url: https://scholar.google.com/citations?user=A84X-3IAAAAJ
    icon: fas fa-graduation-cap
  - title: ORCID
    url: https://orcid.org/0000-0001-6459-6972
    icon: fab fa-orcid
  - title: LinkedIn
    url: https://www.linkedin.com/in/wenri
    icon: fab fa-linkedin
  - title: Bluesky
    url: https://bsky.app/profile/s2.hk
    icon: fab fa-bluesky
  - title: Keybase
    url: https://keybase.io/wenri
    icon: fab fa-keybase

kramdown:
  input: GFM
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..2

mathjax: true

exclude: ["lib", "config.rb", "Capfile", "config", "log", "Rakefile", "Rakefile.rb", "tmp", ".less", "*.sublime-project", "*.sublime-workspace", "test", "spec", "Gruntfile.js", "package.json", "node_modules", "Gemfile", "Gemfile.lock", "LICENSE", "README.md", "README-OLD.md", "CLAUDE.md", "vendor", "docs/", "example/", "Makefile", "nix/", "purgecss.config.js", "CHANGELOG.md", "jekyll-theme-so-simple.gemspec", "screenshot.png", "screenshots.jpg"]



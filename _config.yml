# Site wide configuration

title: Wenri JUSHI
locale: en_US
description: IS NULL and IS NOT NULL
logo: /images/site-logo.png
search: true
url: http://www.wenri.me

# Jekyll configuration

permalink:   /:categories/:title/
markdown:    kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Front Matter Defaults
defaults:
  # Posts defaults
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      share: true

# Site Author
author:
  name: Bingchen Gong
  picture: /images/bio-photo.jpg
  email: gongbingchen@gmail.com

kramdown:
  input: GFM
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..2

mathjax: true

exclude: ["lib", "config.rb", "Capfile", "config", "log", "Rakefile", "Rakefile.rb", "tmp", ".less", "*.sublime-project", "*.sublime-workspace", "test", "spec", "Gruntfile.js", "package.json", "node_modules", "Gemfile", "Gemfile.lock", "LICENSE", "README.md", "README-OLD.md", "CLAUDE.md", "vendor", "docs/", "example/", "Makefile", "nix/", "purgecss.config.js", "CHANGELOG.md", "jekyll-theme-so-simple.gemspec", "screenshot.png", "screenshots.jpg"]


# Google Search Console verification (read by _includes/head.html)
owner:
